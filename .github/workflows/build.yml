name: Build mplc_protocol_fast_modbus

on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh host-tests

  build-armv7hf:
    name: Build ARMv7hf with the vendor SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for pinned SDK and MPS toolchain
        id: inputs
        run: |
          if [[ -f /work/inputs/sa-mplc-inputs/manifest.json && -x /work/toolchains/arm-mpssoft-linux-gnueabihf/bin/arm-mpssoft-linux-gnueabihf-g++ ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ARM build requires the local SDK 35699 and MPS GCC 13.3. Use tools/build_mac.sh on the build workstation."
          fi
      - name: Compile, link and verify ELF
        if: steps.inputs.outputs.available == 'true'
        run: |
          ./build.sh linux-armv7hf --build --inputs /work/inputs/sa-mplc-inputs \
            --toolchain /work/toolchains/arm-mpssoft-linux-gnueabihf --work-dir "$RUNNER_TEMP/arm"
      - uses: actions/upload-artifact@v4
        if: steps.inputs.outputs.available == 'true'
        with:
          name: mplc_protocol_fast_modbus-armv7hf
          path: ${{ runner.temp }}/arm/API/platform/linux/api/mplc_protocol_fast_modbus.so
          retention-days: 30
